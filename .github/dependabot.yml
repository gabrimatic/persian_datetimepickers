version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "pub"
    directories: ["/", "/example"]
    schedule:
      interval: "monthly"
    ignore:
      # The example depends on the package by path.
      - dependency-name: "persian_datetimepickers"
    groups:
      pub:
        patterns: ["*"]
